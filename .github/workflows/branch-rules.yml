name: Branch Rules

on:
  pull_request:
    types: [opened, synchronize, edited, reopened]

permissions:
  contents: read
  pull-requests: read
  statuses: write

jobs:
  check-source-branch:
    name: Check source/target branch
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate branch hierarchy
        env:
          BASE_REF: ${{ github.base_ref }}
          HEAD_REF: ${{ github.head_ref }}
        run: python scripts/ci/check_branch_source.py "$BASE_REF" "$HEAD_REF"

  check-dev-ci:
    name: Check dev CI status
    runs-on: ubuntu-latest
    if: github.base_ref == 'main'
    steps:
      - uses: actions/checkout@v4
      - name: Fetch latest dev CI conclusion
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: python scripts/ci/check_dev_ci.py "$REPO"
