name: Branch Rules

on:
  pull_request:
    types: [opened, synchronize, edited, reopened]

permissions:
  contents: read
  pull-requests: read
  statuses: write

jobs:
  check-source-branch:
    name: Check source/target branch
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate branch hierarchy
        run: bash scripts/ci/check-branch-source.sh "${{ github.base_ref }}" "${{ github.head_ref }}"

  check-dev-ci:
    name: Check dev CI status
    runs-on: ubuntu-latest
    if: github.base_ref == 'main'
    steps:
      - uses: actions/checkout@v4
      - name: Fetch latest dev CI conclusion
        env:
          GH_TOKEN: ${{ github.token }}
        run: bash scripts/ci/check-dev-ci.sh "${{ github.repository }}"
