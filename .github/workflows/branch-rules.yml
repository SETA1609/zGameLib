name: Branch Rules

on:
  pull_request:
    types: [opened, synchronize, edited, reopened]

permissions:
  contents: read
  pull-requests: read
  statuses: write

jobs:
  check-source-branch:
    name: Check source/target branch
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate branch hierarchy
        run: |
          TARGET="${{ github.base_ref }}"
          SOURCE="${{ github.head_ref }}"
          errors=0

          if [ "$TARGET" = "main" ] && [ "$SOURCE" != "dev" ]; then
            echo "::error::PRs targeting 'main' must come from 'dev', not '$SOURCE'"
            errors=$((errors + 1))
          fi

          if [ "$TARGET" = "dev" ] && [ "$SOURCE" = "main" ]; then
            echo "::error::PRs targeting 'dev' must not come from 'main'"
            errors=$((errors + 1))
          fi

          if [ "$errors" -gt 0 ]; then
            echo "See docs/architecture-decisions.md for the branching model."
            exit 1
          fi

          echo "✅ $SOURCE → $TARGET is valid"

  check-dev-ci:
    name: Check dev CI status
    runs-on: ubuntu-latest
    if: github.base_ref == 'main'
    steps:
      - uses: actions/checkout@v4
      - name: Fetch latest dev CI conclusion
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # Get the latest workflow run on the dev branch for the CI workflow
          RUN_JSON=$(gh api repos/${{ github.repository }}/actions/workflows/build.yml/runs \
            --jq '.workflow_runs[] | select(.head_branch == "dev" and .status == "completed") | .conclusion' \
            --paginate 2>/dev/null | head -1)

          if [ -z "$RUN_JSON" ]; then
            echo "::warning::No completed CI run found on 'dev' branch — cannot verify status"
            exit 0
          fi

          if [ "$RUN_JSON" != "success" ]; then
            echo "::error::Latest CI run on 'dev' concluded with '$RUN_JSON' — must be 'success' before merging to main"
            echo "::error::Visit https://github.com/${{ github.repository }}/actions?query=branch:dev to check"
            exit 1
          fi

          echo "✅ Latest CI run on 'dev' passed"
